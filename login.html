<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Login or create an account for KINO LAB."
    >

    <title>KINO LAB — Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-container">

            <div class="auth-brand">

                <p class="brand-small">
                    WELCOME TO
                </p>

                <h1>KINO LAB</h1>

                <p class="brand-description">
                    Your personal cinema collection.
                </p>

            </div>


            <div class="auth-card">

                <div class="auth-tabs">

                    <button
                        id="loginTab"
                        class="auth-tab active"
                        type="button"
                    >
                        Login
                    </button>

                    <button
                        id="registerTab"
                        class="auth-tab"
                        type="button"
                    >
                        Register
                    </button>

                </div>


                <!-- =========================
                     LOGIN FORM
                ========================== -->

                <form id="loginForm" class="auth-form">

                    <div class="input-group">

                        <label for="loginEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="your@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="submit-button"
                    >
                        Enter KINO LAB
                    </button>


                    <div class="divider">
                        <span>OR</span>
                    </div>


                    <!-- GOOGLE LOGIN -->

                    <button
                        type="button"
                        id="googleLoginButton"
                        class="google-button"
                    >

                        <span class="google-icon">
                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    fill="#4285F4"
                                    d="M21.35 12.27c0-.71-.06-1.39-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.22z"
                                />

                                <path
                                    fill="#34A853"
                                    d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.55 0-4.71-1.72-5.49-4.03H3.26v2.53A9.74 9.74 0 0 0 12 21.75z"
                                />

                                <path
                                    fill="#FBBC05"
                                    d="M6.51 13.83a5.85 5.85 0 0 1 0-3.66V7.64H3.26a9.74 9.74 0 0 0 0 8.72l3.25-2.53z"
                                />

                                <path
                                    fill="#EA4335"
                                    d="M12 6.14c1.43 0 2.72.49 3.74 1.45l2.8-2.8C16.83 3.15 14.63 2.25 12 2.25a9.74 9.74 0 0 0-8.74 5.39l3.25 2.53C7.29 7.86 9.45 6.14 12 6.14z"
                                />
                            </svg>
                        </span>

                        <span>
                            Continue with Google
                        </span>

                    </button>

                </form>


                <!-- =========================
                     REGISTER FORM
                ========================== -->

                <form
                    id="registerForm"
                    class="auth-form hidden"
                >

                    <div class="input-group">

                        <label for="registerEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="your@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="submit-button"
                    >
                        Create account
                    </button>


                    <div class="divider">
                        <span>OR</span>
                    </div>


                    <!-- GOOGLE REGISTER -->

                    <button
                        type="button"
                        id="googleRegisterButton"
                        class="google-button"
                    >

                        <span class="google-icon">
                            <svg
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    fill="#4285F4"
                                    d="M21.35 12.27c0-.71-.06-1.39-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.22z"
                                />

                                <path
                                    fill="#34A853"
                                    d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.55 0-4.71-1.72-5.49-4.03H3.26v2.53A9.74 9.74 0 0 0 12 21.75z"
                                />

                                <path
                                    fill="#FBBC05"
                                    d="M6.51 13.83a5.85 5.85 0 0 1 0-3.66V7.64H3.26a9.74 9.74 0 0 0 0 8.72l3.25-2.53z"
                                />

                                <path
                                    fill="#EA4335"
                                    d="M12 6.14c1.43 0 2.72.49 3.74 1.45l2.8-2.8C16.83 3.15 14.63 2.25 12 2.25a9.74 9.74 0 0 0-8.74 5.39l3.25 2.53C7.29 7.86 9.45 6.14 12 6.14z"
                                />
                            </svg>
                        </span>

                        <span>
                            Continue with Google
                        </span>

                    </button>

                </form>


                <p
                    id="authMessage"
                    class="auth-message"
                    aria-live="polite"
                ></p>

            </div>

        </section>

    </main>


    <script type="module" src="auth.js"></script>

</body>

</html>
