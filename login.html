<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Login or create an account for KINO LAB."
    >

    <title>KINO LAB — Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-container">

            <div class="auth-brand">

                <p class="brand-small">
                    WELCOME TO
                </p>

                <h1>KINO LAB</h1>

                <p class="brand-description">
                    Your personal cinema collection.
                </p>

            </div>


            <div class="auth-card">

                <div class="auth-tabs">

                    <button
                        id="loginTab"
                        class="auth-tab active"
                        type="button"
                    >
                        Login
                    </button>

                    <button
                        id="registerTab"
                        class="auth-tab"
                        type="button"
                    >
                        Register
                    </button>

                </div>


                <!-- LOGIN FORM -->

                <form id="loginForm" class="auth-form">

                    <div class="input-group">

                        <label for="loginEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="your@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="submit-button"
                    >
                        Enter KINO LAB
                    </button>

                </form>


                <!-- REGISTER FORM -->

                <form
                    id="registerForm"
                    class="auth-form hidden"
                >

                    <div class="input-group">

                        <label for="registerEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="your@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="submit-button"
                    >
                        Create account
                    </button>

                </form>


                <p
                    id="authMessage"
                    class="auth-message"
                    aria-live="polite"
                ></p>

            </div>

        </section>

    </main>


    <script type="module" src="auth.js"></script>

</body>

</html>
